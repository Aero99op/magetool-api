# Render.com Configuration
# This file auto-configures the deployment on Render

services:
  - type: web
    name: magetool-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TEMP_DIR
        value: /tmp/magetool
    healthCheckPath: /api/health
